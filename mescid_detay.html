<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
TemizMescid | Mescid Detay
</title>

<meta
name="description"
content="Mescid detaylarını görüntüleyin, puanlayın ve kullanıcı değerlendirmelerini inceleyin."
>

<meta
name="theme-color"
content="#0b2422"
>

<link rel="stylesheet" href="style.css">

<style>

/* ========================= */
/* RESET */
/* ========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:
Inter,
system-ui,
sans-serif;

background:
radial-gradient(
circle at top,
#21454b 0%,
#10252a 35%,
#08171b 100%
);

min-height:100vh;
overflow-x:hidden;
}

/* ========================= */
/* PAGE */
/* ========================= */

.page{
max-width:420px;
margin:auto;
padding:18px 18px 140px;
}

/* ========================= */
/* HERO */
/* ========================= */

.hero{
position:relative;
height:260px;
border-radius:32px;
overflow:hidden;
margin-bottom:18px;
background:#222;
box-shadow:
0 12px 40px rgba(0,0,0,.22);
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.hero-overlay{
position:absolute;
inset:0;

background:
linear-gradient(
180deg,
rgba(0,0,0,.08),
rgba(0,0,0,.72)
);

display:flex;
flex-direction:column;
justify-content:flex-end;

padding:24px;
}

.hero-title{
font-size:34px;
font-weight:800;
line-height:1.05;
letter-spacing:-1.4px;
color:#fff;
margin-bottom:14px;
text-shadow:
0 4px 20px rgba(0,0,0,.4);
}

.hero-title-wrap{

display:inline-flex;

align-self:flex-start;

max-width:100%;

padding:
14px 18px;

border-radius:24px;

background:
rgba(0,0,0,.24);

backdrop-filter:
blur(16px);

-webkit-backdrop-filter:
blur(16px);

box-shadow:
0 4px 20px rgba(0,0,0,.18);

margin-bottom:14px;

border:
1px solid rgba(255,255,255,.08);

}

.hero-title{

font-size:34px;
font-weight:800;

line-height:1.02;

letter-spacing:-1.5px;

color:#fff;

text-shadow:
0 2px 12px rgba(0,0,0,.45);

}

.hero-meta{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.score-box{
display:flex;
align-items:center;
gap:6px;

padding:10px 14px;

border-radius:16px;

background:
rgba(255,255,255,.14);

backdrop-filter:blur(14px);

font-size:15px;
font-weight:800;
color:#fff;
}

.location-box{
display:flex;
align-items:center;
gap:6px;

padding:10px 14px;

border-radius:16px;

background:
rgba(255,255,255,.1);

backdrop-filter:blur(14px);

font-size:13px;
font-weight:600;

color:
rgba(255,255,255,.92);
}

/* ========================= */
/* CARD */
/* ========================= */

.card{
background:
linear-gradient(
180deg,
rgba(255,255,255,.985),
rgba(248,250,252,.97)
);

border:
1px solid rgba(255,255,255,.55);

border-radius:28px;

padding:22px;

margin-bottom:18px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);
}

.card-title{
font-size:19px;
font-weight:800;
color:#111827;
margin-bottom:18px;
}

/* ========================= */
/* INFO GRID */
/* ========================= */

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.info-item{
background:#f8fafc;
border-radius:18px;
padding:16px;
}

.info-label{
font-size:12px;
font-weight:700;
color:#6b7280;
margin-bottom:6px;
}

.info-value{
font-size:15px;
font-weight:700;
color:#111827;
}

/* ========================= */
/* SUMMARY */
/* ========================= */

.rating-summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:20px;
}

.summary-item{
background:#f8fafc;
border-radius:18px;
padding:14px;

display:flex;
justify-content:space-between;
align-items:center;

font-size:13px;
font-weight:700;

color:#111827;
}

.summary-item strong{
color:#1b5e20;
}

/* ========================= */
/* BUTTON */
/* ========================= */

.rate-btn{
width:100%;
height:56px;

border:none;

border-radius:20px;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

color:#fff;

font-size:15px;
font-weight:800;

cursor:pointer;

box-shadow:
0 12px 28px rgba(0,0,0,.18);
}

/* ========================= */
/* REVIEWS */
/* ========================= */

.reviews-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.review-count{
font-size:12px;
font-weight:700;
color:#6b7280;
}

.review{
padding-bottom:18px;
margin-bottom:18px;
border-bottom:
1px solid rgba(0,0,0,.06);
}

.review:last-child{
border:none;
margin-bottom:0;
padding-bottom:0;
}

.review-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.review-score{
font-size:15px;
font-weight:800;
color:#1b5e20;
}

.review-breakdown{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:12px;
}

.review-breakdown span{
background:#f3f4f6;
padding:8px 10px;
border-radius:12px;
font-size:11px;
font-weight:700;
color:#374151;
}

.review-text{
font-size:14px;
line-height:1.8;
color:#4b5563;
margin-bottom:10px;
}

.review-date{
font-size:12px;
color:#9ca3af;
}

.review-empty{
font-size:14px;
color:#6b7280;
}

/* ========================= */
/* MODAL */
/* ========================= */

.rating-modal{
position:fixed;
inset:0;

background:
rgba(0,0,0,.65);

backdrop-filter:blur(12px);

display:none;

align-items:flex-end;
justify-content:center;

z-index:999999;
}

.rating-modal.show{
display:flex;
}

.rating-sheet{
width:100%;
max-width:420px;

background:#fff;

border-radius:32px 32px 0 0;

padding:22px;

max-height:88vh;

overflow-y:auto;
}

.rating-head{
display:flex;
justify-content:space-between;
align-items:flex-start;
margin-bottom:24px;
}

.rating-badge{
display:inline-flex;
align-items:center;
height:28px;
padding:0 12px;
border-radius:999px;
background:#ecfdf3;
color:#15803d;
font-size:11px;
font-weight:700;
margin-bottom:10px;
}

.rating-head h3{
font-size:24px;
font-weight:800;
line-height:1.1;
color:#111827;
}

.rating-close{
width:38px;
height:38px;
border:none;
border-radius:14px;
background:#f3f4f6;
font-size:14px;
}

.rating-group{
margin-bottom:18px;
}

.rating-group label{
display:block;
font-size:14px;
font-weight:700;
color:#111827;
margin-bottom:10px;
}

.star-row{
font-size:28px;
letter-spacing:4px;
color:#d1d5db;
}

.rating-divider{
padding:12px 0;
font-size:13px;
font-weight:800;
color:#15803d;
border-top:1px solid rgba(0,0,0,.06);
margin:10px 0 18px;
}

.rating-inline{
display:flex;
gap:12px;
margin-bottom:18px;
}

.mini-toggle{
flex:1;
background:#f8fafc;
border-radius:18px;
padding:14px;
}

.mini-toggle span{
display:block;
font-size:13px;
font-weight:700;
color:#111827;
margin-bottom:12px;
}

.mini-toggle button{
width:100%;
height:40px;
border:none;
border-radius:12px;
background:#1b5e20;
color:#fff;
font-size:12px;
font-weight:700;
}

.review-area{
width:100%;
height:110px;

border:none;
outline:none;
resize:none;

background:#f8fafc;

border-radius:20px;

padding:16px;

font-size:14px;

margin-top:10px;
margin-bottom:18px;
}

.submit-rating{
width:100%;
height:56px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

color:#fff;

font-size:15px;
font-weight:800;
}

/* ========================= */
/* LOADER */
/* ========================= */

.loader{
padding:80px 20px;
text-align:center;
font-size:14px;
color:#fff;
}

/* ========================= */
/* FOOTER */
/* ========================= */

.footer{
position:fixed;
}

/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:480px){

.page{
padding:16px 16px 140px;
}

.hero{
height:240px;
}

.hero-title{
font-size:30px;
}

.card{
padding:20px;
}

}

</style>

</head>

<body>

<main class="page" id="app">

<div class="loader">
Yükleniyor...
</div>

</main>

<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<nav class="footer">

<div
class="nav-item"
onclick="location.href='index.html'"
>
<span class="nav-icon">⌂</span>
<p>Ana</p>
</div>

<div
class="nav-item active"
onclick="location.href='mescidler.html'"
>
<span class="nav-icon">★</span>
<p>Mescidler</p>
</div>

<button
type="button"
class="center-btn"
onclick="startForm()"
>
+
</button>

<div
class="nav-item"
onclick="location.href='sosyal.html'"
>
<span class="nav-icon">◎</span>
<p>Sosyal</p>
</div>

<div
class="nav-item"
onclick="location.href='iletisim.html'"
>
<span class="nav-icon">✉</span>
<p>İletişim</p>
</div>

</nav>

<script>

/* ========================= */
/* CONFIG */
/* ========================= */

const API_BASE =
"https://spring-violet-7aa7.temizmescid.workers.dev";

/* ========================= */
/* PARAMS */
/* ========================= */

const params =
new URLSearchParams(location.search);

const slug =
params.get("slug");

/* ========================= */
/* INIT */
/* ========================= */

loadMescid();

/* ========================= */
/* FETCH */
/* ========================= */

async function loadMescid(){

try{

const res = await fetch(
`${API_BASE}/api/mescid/${slug}`
);

const data = await res.json();

if(!data.success){

document.getElementById("app").innerHTML = `
<div class="loader">
Mescid bulunamadı
</div>
`;

return;

}

render(data);

}
catch(e){

document.getElementById("app").innerHTML = `
<div class="loader">
Bir hata oluştu
</div>
`;

}

}

/* ========================= */
/* ESCAPE */
/* ========================= */

function escapeHtml(text){

return text
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}

/* ========================= */
/* RENDER */
/* ========================= */

function render(data){

const mescid =
data.mescid;

const reviews =
data.reviews || [];

document.getElementById("app").innerHTML = `

<section class="hero">

<img
src="${
mescid.image ||
'https://images.unsplash.com/photo-1514890547357-a9ee288728e0?q=80&w=1200&auto=format&fit=crop'
}"
alt="${mescid.name}"
>

<div class="hero-overlay">

<div class="hero-title-wrap">

  <div class="hero-title">
    ${mescid.name}
  </div>

</div>

<div class="hero-meta">

<div class="score-box">
⭐ ${mescid.average_score || "0.0"}
</div>

<div class="location-box">
📍 ${mescid.city} / ${mescid.district}
</div>

</div>

</div>

</section>

<section class="card">

<div class="card-title">
Mescid Bilgileri
</div>

<div class="info-grid">

<div class="info-item">
<div class="info-label">
Kategori
</div>
<div class="info-value">
${mescid.category || "-"}
</div>
</div>

<div class="info-item">
<div class="info-label">
Değerlendirme
</div>
<div class="info-value">
${mescid.review_count || 0} oy
</div>
</div>

<div class="info-item">
<div class="info-label">
Şehir
</div>
<div class="info-value">
${mescid.city || "-"}
</div>
</div>

<div class="info-item">
<div class="info-label">
İlçe
</div>
<div class="info-value">
${mescid.district || "-"}
</div>
</div>

</div>

</section>

<section class="card">

<div class="rating-summary">

<div class="summary-item">
<span>🧼 Temizlik</span>
<strong>${mescid.clean_score || "4.8"}</strong>
</div>

<div class="summary-item">
<span>🤫 Sessizlik</span>
<strong>${mescid.sound_score || "4.5"}</strong>
</div>

<div class="summary-item">
<span>💨 Havalandırma</span>
<strong>${mescid.air_score || "4.4"}</strong>
</div>

<div class="summary-item">
<span>🚿 Abdesthane</span>
<strong>
${mescid.has_ablution ? "Var" : "Yok"}
</strong>
</div>

</div>

<button
class="rate-btn"
onclick="
openRatingModal('${mescid.id}')
"
>
Mescidi Puanla
</button>

</section>

<section class="card">

<div class="reviews-head">

<div class="card-title">
Son Değerlendirmeler
</div>

<div class="review-count">
${reviews.length} değerlendirme
</div>

</div>

${
reviews.length

?

reviews.map(review=>`

<div class="review">

<div class="review-top">

<div class="review-score">
⭐ ${review.overall_score}
</div>

<div class="review-date">
${formatDate(review.created_at)}
</div>

</div>

<div class="review-breakdown">

<span>
🧼 ${review.cleanliness || "-"}
</span>

<span>
🤫 ${review.sound || "-"}
</span>

<span>
💨 ${review.air || "-"}
</span>

</div>

<div class="review-text">
${escapeHtml(
review.comment || "Yorum yapılmadı"
)}
</div>

</div>

`).join("")

:

`

<div class="review-empty">
Henüz değerlendirme bulunmuyor.
</div>

`

}

</section>

<div
id="ratingModal"
class="rating-modal"
>

<div
class="rating-sheet"
onclick="event.stopPropagation()"
>

<div class="rating-head">

<div>

<div class="rating-badge">
Değerlendirme
</div>

<h3>
${mescid.name}
</h3>

</div>

<button
type="button"
class="rating-close"
onclick="closeRatingModal()"
>
✕
</button>

</div>

<div class="rating-group">

<label>
Temizlik
</label>

<div class="star-row">
★★★★★
</div>

</div>

<div class="rating-group">

<label>
Sessizlik / Huzur
</label>

<div class="star-row">
★★★★★
</div>

</div>

<div class="rating-group">

<label>
Havalandırma
</label>

<div class="star-row">
★★★★★
</div>

</div>

<div class="rating-group">

<label>
Halı / Zemin
</label>

<div class="star-row">
★★★★★
</div>

</div>

${
mescid.has_ablution

?

`

<div class="rating-divider">
Abdesthane
</div>

<div class="rating-group">

<label>
Abdesthane Temizlik
</label>

<div class="star-row">
★★★★★
</div>

</div>

<div class="rating-group">

<label>
Islak Zemin
</label>

<div class="star-row">
★★★★★
</div>

</div>

<div class="rating-inline">

<div class="mini-toggle">

<span>
Sabun
</span>

<button>
Evet
</button>

</div>

<div class="mini-toggle">

<span>
Kağıt Havlu
</span>

<button>
Evet
</button>

</div>

</div>

`

:

""

}

<textarea
class="review-area"
placeholder="İsterseniz kısa değerlendirme yazabilirsiniz..."
></textarea>

<button
class="submit-rating"
onclick="
submitRating('${mescid.id}')
"
>
Değerlendirmeyi Gönder
</button>

</div>

</div>

`;

}

/* ========================= */
/* DATE */
/* ========================= */

function formatDate(date){

if(!date) return "";

return new Date(date)
.toLocaleDateString("tr-TR");

}

/* ========================= */
/* MODAL */
/* ========================= */

function openRatingModal(id){

const rated =
localStorage.getItem(
`rated_${id}`
);

if(rated){

alert(
"Bu mescidi bugün zaten değerlendirdiniz."
);

return;

}

document
.getElementById("ratingModal")
.classList.add("show");

}

function closeRatingModal(){

document
.getElementById("ratingModal")
.classList.remove("show");

}

/* ========================= */
/* SUBMIT */
/* ========================= */

function submitRating(id){

localStorage.setItem(
`rated_${id}`,
Date.now()
);

alert(
"Değerlendirmeniz alındı."
);

closeRatingModal();

}

/* ========================= */
/* NEW MESCID */
/* ========================= */

function startForm(){

location.href =
"index.html";

}

</script>

</body>
</html>
