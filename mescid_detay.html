<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
TemizMescid | Mescid Detay
</title>

<meta
name="description"
content="Mescid detaylarını görüntüleyin, puanlayın ve kullanıcı değerlendirmelerini inceleyin."
>

<meta
name="theme-color"
content="#0b2422"
>

<link rel="stylesheet" href="style.css">

<style>

/* ========================= */
/* RESET */
/* ========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:
Inter,
system-ui,
sans-serif;

background:
radial-gradient(
circle at top,
#21454b 0%,
#10252a 35%,
#08171b 100%
);

min-height:100vh;
overflow-x:hidden;
}

/* ========================= */
/* PAGE */
/* ========================= */

.page{
max-width:420px;
margin:auto;
padding:18px 18px 140px;
}


.score-box{
display:flex;
align-items:center;
gap:6px;

padding:10px 14px;

border-radius:16px;

background:
rgba(255,255,255,.14);

backdrop-filter:blur(14px);

font-size:15px;
font-weight:800;
color:#fff;
}

.location-box{
display:flex;
align-items:center;
gap:6px;

padding:10px 14px;

border-radius:16px;

background:
rgba(255,255,255,.1);

backdrop-filter:blur(14px);

font-size:13px;
font-weight:600;

color:
rgba(255,255,255,.92);
}

/* ========================= */
/* CARD */
/* ========================= */

.card{
background:
linear-gradient(
180deg,
rgba(255,255,255,.985),
rgba(248,250,252,.97)
);

border:
1px solid rgba(255,255,255,.55);

border-radius:28px;

padding:22px;

margin-bottom:18px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);
}

.card-title{
font-size:19px;
font-weight:800;
color:#111827;
margin-bottom:18px;
}

/* ========================= */
/* INFO GRID */
/* ========================= */

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.info-item{
background:#f8fafc;
border-radius:18px;
padding:16px;
}

.info-label{
font-size:12px;
font-weight:700;
color:#6b7280;
margin-bottom:6px;
}

.info-value{
font-size:15px;
font-weight:700;
color:#111827;
}

/* ========================= */
/* SUMMARY */
/* ========================= */

.rating-summary{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:14px;
}

.summary-item{
background:#f8fafc;
border-radius:20px;
padding:16px;
min-height:72px;

display:flex;
flex-direction:column;
justify-content:space-between;

font-size:13px;
font-weight:700;

color:#111827;

border:1px solid rgba(0,0,0,.04);
}

.summary-item strong{
color:#1b5e20;
}

/* ========================= */
/* BUTTON */
/* ========================= */

.rate-btn{
width:100%;
height:56px;

border:none;

border-radius:20px;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

color:#fff;

font-size:15px;
font-weight:800;

cursor:pointer;

box-shadow:
0 12px 28px rgba(0,0,0,.18);
}

/* ========================= */
/* REVIEWS */
/* ========================= */

.reviews-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.review-count{
font-size:12px;
font-weight:700;
color:#6b7280;
}

.review{
padding-bottom:18px;
margin-bottom:18px;
border-bottom:
1px solid rgba(0,0,0,.06);
}

.review:last-child{
border:none;
margin-bottom:0;
padding-bottom:0;
}

.review-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.review-score{
font-size:15px;
font-weight:800;
color:#1b5e20;
}

.review-breakdown{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

margin-bottom:14px;

}

.review-breakdown span{
background:#f3f4f6;
padding:8px 10px;
border-radius:12px;
font-size:11px;
font-weight:700;
color:#374151;
}


.summary-mini{

display:flex;
align-items:center;
justify-content:space-between;

gap:10px;

width:100%;

padding:12px 14px;

border-radius:14px;

background:#f8fafc;

border:1px solid rgba(0,0,0,.05);

font-size:12px;
font-weight:700;

color:#374151;

}

.summary-mini b{

font-size:13px;
font-weight:800;

color:#1b5e20;

}

.review-text{
font-size:14px;
line-height:1.8;
color:#4b5563;
margin-bottom:10px;
}

.review-date{
font-size:12px;
color:#9ca3af;
}

.review-empty{
font-size:14px;
color:#6b7280;
}

/* ========================= */
/* MODAL */
/* ========================= */

.rating-modal{
position:fixed;
inset:0;

background:
rgba(0,0,0,.65);

backdrop-filter:blur(12px);

display:none;

align-items:flex-end;
justify-content:center;

z-index:999999;
}

.rating-modal.show{
display:flex;
}

.rating-sheet{
width:100%;
max-width:420px;

background:#fff;

border-radius:32px 32px 0 0;

padding:22px;

max-height:88vh;

overflow-y:auto;
}

.rating-head{
display:flex;
justify-content:space-between;
align-items:flex-start;
margin-bottom:24px;
}

.rating-badge{
display:inline-flex;
align-items:center;
height:28px;
padding:0 12px;
border-radius:999px;
background:#ecfdf3;
color:#15803d;
font-size:11px;
font-weight:700;
margin-bottom:10px;
}

.rating-head h3{
font-size:24px;
font-weight:800;
line-height:1.1;
color:#111827;
}

.rating-close{
width:38px;
height:38px;
border:none;
border-radius:14px;
background:#f3f4f6;
font-size:14px;
}

.rating-group{
margin-bottom:18px;
}

.rating-group label{
display:block;
font-size:14px;
font-weight:700;
color:#111827;
margin-bottom:10px;
}

.star-row{
display:flex;
gap:6px;
}

.star-row span{
font-size:30px;
cursor:pointer;
color:#d1d5db;
transition:.2s;
}

.star-row span.active{
color:#f59e0b;
transform:scale(1.08);
}

.rating-divider{
padding:12px 0;
font-size:13px;
font-weight:800;
color:#15803d;
border-top:1px solid rgba(0,0,0,.06);
margin:10px 0 18px;
}

.rating-inline{
display:flex;
gap:12px;
margin-bottom:18px;
}

.mini-toggle{
flex:1;
background:#f8fafc;
border-radius:18px;
padding:14px;
}

.mini-toggle span{
display:block;
font-size:13px;
font-weight:700;
color:#111827;
margin-bottom:12px;
}

.mini-toggle button{
width:100%;
height:40px;
border:none;
border-radius:12px;
background:#1b5e20;
color:#fff;
font-size:12px;
font-weight:700;
}

.review-area{
width:100%;
height:110px;

border:none;
outline:none;
resize:none;

background:#f8fafc;

border-radius:20px;

padding:16px;

font-size:14px;

margin-top:10px;
margin-bottom:18px;
}

.submit-rating{
width:100%;
height:56px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

color:#fff;

font-size:15px;
font-weight:800;
}

/* ========================= */
/* LOADER */
/* ========================= */

.loader{
padding:80px 20px;
text-align:center;
font-size:14px;
color:#fff;
}


/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:480px){

.page{
padding:16px 16px 140px;
}


.hero-title{
font-size:30px;
}

.card{
padding:20px;
}

}


.hero-slider::-webkit-scrollbar{
display:none;
}


/* =========================
DETAIL HERO GALLERY
========================= */

.hero-gallery{

position:relative;

width:100%;
aspect-ratio:16/10;

border-radius:32px;

overflow:hidden;

background:#111827;

margin-bottom:18px;

box-shadow:
0 12px 40px rgba(0,0,0,.25);

}

.hero-slider{

display:flex;

width:100%;
height:100%;

overflow-x:auto;

scroll-snap-type:x mandatory;

scrollbar-width:none;

-webkit-overflow-scrolling:touch;

scroll-behavior:smooth;

}

.hero-slider::-webkit-scrollbar{
display:none;
}

.hero-slide{

min-width:100%;
width:100%;
height:100%;

position:relative;

scroll-snap-align:center;

flex-shrink:0;

overflow:hidden;

}


.hero-slide img{

position:absolute;

inset:0;

width:100%;

height:100%;

object-fit:cover;
object-position:center;

image-rendering:auto;

display:block;

z-index:1;

background:#111827;

}

.hero-slider{

display:flex;

width:100%;
height:100%;

overflow-x:auto;

scroll-snap-type:x mandatory;

scrollbar-width:none;

-webkit-overflow-scrolling:touch;

scroll-behavior:smooth;

touch-action: pan-x;

}

.hero-overlay{

position:absolute;
inset:0;

background:
linear-gradient(
180deg,
rgba(0,0,0,.08),
rgba(0,0,0,.72)
);

z-index:2;

}

.hero-content{

position:absolute;

left:20px;
right:20px;
bottom:24px;

z-index:3;

pointer-events:none;

}

.hero-title{

display:inline-block;

padding:
14px 18px;

border-radius:24px;

background:
rgba(0,0,0,.22);

backdrop-filter:
blur(14px);

font-size:34px;
font-weight:800;

line-height:1;

color:#fff;

margin-bottom:14px;

}

.hero-meta{

display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;

}

.hero-dots{

position:absolute;

left:0;
right:0;
bottom:10px;

display:flex;

justify-content:center;

gap:8px;

z-index:5;

pointer-events:none;

}

.hero-dots span{

width:8px;
height:8px;

border-radius:999px;

background:
rgba(255,255,255,.35);

transition:.25s;

}

.hero-dots span.active{

width:24px;

background:#fff;

}

/* =========================
DETAIL GALLERY
========================= */

.gallery-section{

margin-bottom:18px;

}

.gallery-title{

font-size:18px;

font-weight:800;

color:#fff;

margin-bottom:14px;

padding:0 4px;

}

.gallery-row{

display:flex;

gap:12px;

overflow-x:auto;

scroll-snap-type:x mandatory;

scrollbar-width:none;

-webkit-overflow-scrolling:touch;

padding-bottom:4px;

}

.gallery-row::-webkit-scrollbar{
display:none;
}

.gallery-image{

width:160px;

height:120px;

object-fit:cover;

border-radius:20px;

flex-shrink:0;

scroll-snap-align:start;

background:#111827;

box-shadow:
0 8px 24px rgba(0,0,0,.22);

}

</style>

</head>
<body>

<main class="page" id="app">

<div class="loader">
Yükleniyor...
</div>

</main>


<script>

/* ========================= */
/* CONFIG */
/* ========================= */

const API_BASE =
window.location.origin;

/* ========================= */
/* PARAMS */
/* ========================= */

const params =
new URLSearchParams(location.search);

const slug =
params.get("slug");

/* ========================= */
/* GLOBAL */
/* ========================= */

const ratings = {};
let currentMescid = null;

const toggles = {
soap : null,
paper : null
};

/* ========================= */
/* INIT */
/* ========================= */

loadMescid();
/* ========================= */
/* FETCH */
/* ========================= */

async function loadMescid(){

try{

const res = await fetch(
`${API_BASE}/api/mescid/${slug}`
);

if(!res.ok){

throw new Error(
`API ERROR: ${res.status}`
);

}

const text =
await res.text();

let data;

try{

data = JSON.parse(text);

}
catch(err){

console.error(
"JSON PARSE ERROR:",
text
);

throw err;

}

if(!data.success){

document.getElementById("app").innerHTML = `
<div class="loader">
Mescid bulunamadı
</div>
`;

return;

}

render(data);

}
catch(e){

console.error(e);

document.getElementById("app").innerHTML = `
<div class="loader">
Bir hata oluştu
</div>
`;

}

}

/* ========================= */
/* ESCAPE */
/* ========================= */

function escapeHtml(text=""){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

/* ========================= */
/* DATE */
/* ========================= */

function formatDate(date){

if(!date) return "";

return new Date(date)
.toLocaleDateString("tr-TR");

}

/* ========================= */
/* RENDER */
/* ========================= */

function render(data){

const mescid =
data.mescid || {};

currentMescid = mescid;

const reviews =
data.reviews || [];

/* =========================
IMAGES
========================= */

const images = [

...(data.images || [])

.map(x => {

if(typeof x === "string"){

return x.trim();

}

return (
x?.image_url ||
x?.image ||
x?.url ||
""
).trim();

})

.filter(Boolean)

];

/* LOW QUALITY FILTER */

const filteredImages =

images.filter(img=>{

const lower =
img.toLowerCase();

return (

!lower.includes("thumbnail") &&
!lower.includes("thumb") &&
!lower.includes("small") &&
!lower.includes("avatar")

);

});

/* FALLBACK */

if(
filteredImages.length === 0 &&
mescid.image
){

filteredImages.push(
String(mescid.image).trim()
);

}

if(filteredImages.length === 0){

filteredImages.push(
"https://images.unsplash.com/photo-1514890547357-a9ee288728e0?q=80&w=1200&auto=format&fit=crop"
);

}


/* =========================
RENDER
========================= */

document.getElementById("app").innerHTML = `

<!-- HERO -->

<section class="hero-gallery">

<div
class="hero-slider"
id="heroSlider"
>

${[...filteredImages]
.reverse()
.map((img,index)=>`

<div class="hero-slide">

<img
src="${img}"
alt="${escapeHtml(mescid.name || "Mescid")}"
loading="${index === 0 ? 'eager' : 'lazy'}"
decoding="async"
referrerpolicy="no-referrer"
>

<div class="hero-overlay"></div>

</div>

`).join("")}

</div>

<div
class="hero-dots"
id="heroDots"
></div>

<div class="hero-content">

<div class="hero-title">
${escapeHtml(mescid.name || "-")}
</div>

<div class="hero-meta">

<div class="score-box">
⭐ ${mescid.average_score || "0.0"}
</div>

<div class="location-box">
📍 ${escapeHtml(mescid.city || "-")} /
${escapeHtml(mescid.district || "-")}
</div>

</div>

</div>

</section>

<!-- GALLERY -->

<section class="gallery-section">

<div class="gallery-title">
📷 Fotoğraflar
</div>

<div class="gallery-row">

${filteredImages.map(img=>`

<img
src="${img}"
referrerpolicy="no-referrer"
class="gallery-image"
loading="lazy"
decoding="async"
>


`).join("")}

</div>

</section>

<!-- SUMMARY -->

<section class="card">

<div class="rating-summary">

<div class="summary-item">
<span>🧼 Temizlik</span>
<strong>
${mescid.clean_score ?? 0}
</strong>
</div>

<div class="summary-item">
<span>🤫 Sessizlik</span>
<strong>
${mescid.sound_score ?? 0}
</strong>
</div>

<div class="summary-item">
<span>💨 Havalandırma</span>
<strong>
${mescid.air_score ?? 0}
</strong>
</div>

<div class="summary-item">
<span>💡 Işıklandırma</span>
<strong>
${mescid.light_score ?? 0}
</strong>
</div>

<div class="summary-item">
<span>🕌 Halı / Zemin</span>
<strong>
${mescid.floor_score ?? 0}
</strong>
</div>

<div class="summary-item">
<span>🚿 Abdesthane</span>
<strong>
${
Number(mescid.has_ablution) === 1
? "Var"
: "Yok"
}
</strong>
</div>

</div>

<button
class="rate-btn"
onclick="openRatingModal('${mescid.id}')"
>
Mescidi Puanla
</button>

</section>






<!-- REVIEWS -->

<section class="card">

<div class="reviews-head">

<div class="card-title">
Son Değerlendirmeler
</div>

<div class="review-count">
${reviews.length} değerlendirme
</div>

</div>

${
reviews.length

?

reviews.map(review=>`

<div class="review">

<div class="review-top">

<div class="review-score">
⭐ ${review.overall_score ?? 0}
</div>

<div class="review-date">
${formatDate(review.created_at)}
</div>

</div>

<div class="summary-mini">
<span>🧼 Temizlik</span>
<b>${review.cleanliness ?? 0}</b>
</div>

<div class="summary-mini">
<span>🤫 Sessizlik</span>
<b>${review.sound ?? 0}</b>
</div>

<div class="summary-mini">
<span>💨 Havalandırma</span>
<b>${review.air ?? 0}</b>
</div>

<div class="summary-mini">
<span>🕌 Halı / Zemin</span>
<b>${review.floor ?? 0}</b>
</div>

</div>

<div class="review-text">
${escapeHtml(
review.comment || "Yorum yapılmadı"
)}
</div>

</div>

`).join("")

:

`

<div class="review-empty">
Henüz değerlendirme bulunmuyor.
</div>

`

}
</section>



<!-- MODAL -->

<div
id="ratingModal"
class="rating-modal"
onclick="closeRatingModal()"
>

<div
class="rating-sheet"
onclick="event.stopPropagation()"
>

<div class="rating-head">

<div>

<div class="rating-badge">
Değerlendirme
</div>

<h3>
${escapeHtml(mescid.name || "-")}
</h3>

</div>

<button
type="button"
class="rating-close"
onclick="closeRatingModal()"
>
✕
</button>

</div>

<!-- CLEAN -->

<!-- LOCATION -->

<div class="rating-group">

<label>
Konum / Ulaşım
</label>

<div
class="star-row"
data-rating="location"
>

<span onclick="setRating(this,1)">★</span>
<span onclick="setRating(this,2)">★</span>
<span onclick="setRating(this,3)">★</span>
<span onclick="setRating(this,4)">★</span>
<span onclick="setRating(this,5)">★</span>

</div>

</div>


<div class="rating-group">

<label>
Temizlik
</label>

<div
class="star-row"
data-rating="cleanliness"
>

<span onclick="setRating(this,1)">★</span>
<span onclick="setRating(this,2)">★</span>
<span onclick="setRating(this,3)">★</span>
<span onclick="setRating(this,4)">★</span>
<span onclick="setRating(this,5)">★</span>

</div>

</div>

<!-- SOUND -->

<div class="rating-group">

<label>
Sessizlik / Huzur
</label>

<div
class="star-row"
data-rating="sound"
>

<span onclick="setRating(this,1)">★</span>
<span onclick="setRating(this,2)">★</span>
<span onclick="setRating(this,3)">★</span>
<span onclick="setRating(this,4)">★</span>
<span onclick="setRating(this,5)">★</span>

</div>

</div>

<!-- AIR -->

<div class="rating-group">

<label>
Havalandırma
</label>

<div
class="star-row"
data-rating="air"
>

<span onclick="setRating(this,1)">★</span>
<span onclick="setRating(this,2)">★</span>
<span onclick="setRating(this,3)">★</span>
<span onclick="setRating(this,4)">★</span>
<span onclick="setRating(this,5)">★</span>

</div>

</div>

<!-- FLOOR -->

<!-- LIGHT -->

<div class="rating-group">

<label>
Işıklandırma
</label>

<div
class="star-row"
data-rating="light"
>

<span onclick="setRating(this,1)">★</span>
<span onclick="setRating(this,2)">★</span>
<span onclick="setRating(this,3)">★</span>
<span onclick="setRating(this,4)">★</span>
<span onclick="setRating(this,5)">★</span>

</div>

</div>

<div class="rating-group">

<label>
Halı / Zemin
</label>

<div
class="star-row"
data-rating="floor"
>

<span onclick="setRating(this,1)">★</span>
<span onclick="setRating(this,2)">★</span>
<span onclick="setRating(this,3)">★</span>
<span onclick="setRating(this,4)">★</span>
<span onclick="setRating(this,5)">★</span>

</div>

</div>

${
Number(mescid.has_ablution) === 1

?

`

<div class="rating-divider">
Abdesthane
</div>

<div class="rating-group">

<label>
Abdesthane Temizlik
</label>

<div
class="star-row"
data-rating="ablution_clean"
>

<span onclick="setRating(this,1)">★</span>
<span onclick="setRating(this,2)">★</span>
<span onclick="setRating(this,3)">★</span>
<span onclick="setRating(this,4)">★</span>
<span onclick="setRating(this,5)">★</span>

</div>

</div>

<div class="rating-group">

<label>
Islak Zemin
</label>

<div
class="star-row"
data-rating="wet_floor"
>

<span onclick="setRating(this,1)">★</span>
<span onclick="setRating(this,2)">★</span>
<span onclick="setRating(this,3)">★</span>
<span onclick="setRating(this,4)">★</span>
<span onclick="setRating(this,5)">★</span>

</div>

</div>

<div class="rating-inline">

type="button"
id="soapBtn"

>
Hayır

`

:

""

}

id="reviewText"

></textarea>

>
Değerlendirmeyi Gönder
</button>

`;

/* =========================
HERO DOTS
========================= */

const heroSlider =
document.getElementById(
"heroSlider"
);

const heroDots =
document.getElementById(
"heroDots"
);

if(heroSlider && heroDots){

heroDots.innerHTML =
filteredImages.map((_,i)=>`
<span class="${
i === 0 ? 'active' : ''
}"></span>
`).join("");

const dots =
heroDots.querySelectorAll("span");

heroSlider.addEventListener(
"scroll",
()=>{

const index =
Math.round(
heroSlider.scrollLeft /
heroSlider.clientWidth
);

dots.forEach((dot,i)=>{

dot.classList.toggle(
"active",
i === index
);

});

}
);

}

}

/* ========================= */
/* STAR RATING */
/* ========================= */

function setRating(el,value){

const row =
el.parentElement;

const stars =
row.querySelectorAll("span");

stars.forEach((star,index)=>{

star.classList.toggle(
"active",
index < value
);

});

const key =
row.dataset.rating;

ratings[key] = value;

}

/* ========================= */
/* TOGGLE */
/* ========================= */

function toggleOption(type,btn){

toggles[type] =
toggles[type] === true
? false
: true;

btn.classList.toggle(
"active",
toggles[type]
);

btn.innerText =
toggles[type]
? "Evet"
: "Hayır";

}

/* ========================= */
/* MODAL */
/* ========================= */

function openRatingModal(id){

const ratedData =
localStorage.getItem(
`rated_${id}`
);

if(ratedData){

const lastVote =
Number(ratedData);

const diff =
Date.now() - lastVote;

const hours =
diff / (1000*60*60);

if(hours < 24){

alert(
"Bu mescidi son 24 saat içinde değerlendirdiniz."
);

return;

}

}

document
.getElementById("ratingModal")
.classList.add("show");

}

function closeRatingModal(){

document
.getElementById("ratingModal")
.classList.remove("show");

}/* ========================= */
/* SUBMIT */
/* ========================= */

async function submitRating(id){

const requiresAblution = 
Number(currentMescid?.has_ablution) === 1;

const missingMainScores =

!ratings.cleanliness ||
!ratings.sound ||
!ratings.air ||
!ratings.floor;

const missingAblutionScores = (
  requiresAblution &&
  (
    !ratings.ablution_clean ||
    !ratings.wet_floor
  )
);

if(

missingMainScores ||

missingAblutionScores

){

alert(
"Lütfen tüm puanlamaları tamamlayın."
);

return;

}

const payload = {

mescid_id : id,

user_hash : (()=>{

let hash =
localStorage.getItem("user_hash");

if(!hash){

hash =
crypto.randomUUID();

localStorage.setItem(
"user_hash",
hash
);

}

return hash;

})(),

/* SCORES */

location_score :
ratings.location || 0,

cleanliness_score :
ratings.cleanliness || 0,

peace_score :
ratings.sound || 0,

climate_score :
ratings.air || 0,

light_score :
ratings.light || 0,

carpet_score :
ratings.floor || 0,

ablution_clean_score :
ratings.ablution_clean || 0,

wet_floor_score :
ratings.wet_floor || 0,

/* BOOLEAN */

library_exists :
toggles.library || false,

staff_exists :
toggles.staff || false,

air_condition_exists :
toggles.airCondition || false,

women_area_exists :
toggles.womenArea || false,

ablution_exists :
Number(currentMescid?.has_ablution) === 1,

paper_towel_exists :
toggles.paper || false,

/* COMMENT */

comment :
document
.getElementById("reviewText")
.value
.trim()

};

try{

const res = await fetch(
`${API_BASE}/api/review/create`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
}
);

const data =
await res.json();

if(!data.success){

alert(
data.error ||
"Değerlendirme gönderilemedi."
);

return;

}

localStorage.setItem(
`rated_${id}`,
Date.now()
);

alert(
"Değerlendirmeniz kaydedildi."
);

closeRatingModal();

loadMescid();

}
catch(e){

console.error(e);

alert(
"Bir bağlantı hatası oluştu."
);

}

}

location.href =
"index.html";

}
