<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>
Zikirmatik | TemizMescid
</title>

<meta
name="theme-color"
content="#08171b"
>

<link rel="stylesheet" href="style.css">

<link
href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
Inter,
system-ui,
sans-serif;

background:
radial-gradient(
circle at top,
#1d4d46 0%,
#0c2427 38%,
#071316 100%
);

color:#fff;

min-height:100vh;

overflow-x:hidden;

}

.page{

max-width:520px;

margin:auto;

padding:
22px 18px 140px;

}

.hero{

padding:
30px 24px;

border-radius:34px;

background:
linear-gradient(
180deg,
rgba(14,42,40,.98),
rgba(9,25,28,.96)
);

border:
1px solid rgba(255,255,255,.06);

box-shadow:
0 18px 50px rgba(0,0,0,.28);

margin-bottom:24px;

}

.hero-badge{

display:inline-flex;

align-items:center;

padding:
8px 14px;

border-radius:999px;

background:
rgba(255,255,255,.08);

font-size:12px;
font-weight:700;

margin-bottom:18px;

}

.hero h1{

font-size:42px;
font-weight:900;

line-height:1.05;

margin-bottom:12px;

}

.hero p{

font-size:14px;

line-height:1.8;

color:
rgba(255,255,255,.72);

}

.zikir-card{

padding:
26px;

border-radius:34px;

background:
rgba(255,255,255,.96);

color:#111827;

box-shadow:
0 12px 30px rgba(0,0,0,.12);

text-align:center;

margin-bottom:20px;

}

.zikir-label{

font-size:18px;
font-weight:800;

margin-bottom:14px;

}

.zikir-name{

font-size:34px;
font-weight:900;

color:#166534;

margin-bottom:10px;

}

.zikir-desc{

font-size:14px;

line-height:1.8;

color:#4b5563;

margin-bottom:24px;

}

.counter{

font-size:72px;
font-weight:900;

margin-bottom:24px;

color:#111827;

}

.big-button{

width:220px;
height:220px;

border:none;

border-radius:999px;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

color:#fff;

font-size:28px;
font-weight:900;

box-shadow:
0 20px 50px rgba(0,0,0,.28);

}

.big-button:active{

transform:scale(.97);

}

.reset-btn{

margin-top:24px;

width:100%;
height:56px;

border:none;

border-radius:18px;

background:#111827;

color:#fff;

font-size:15px;
font-weight:800;

}

.progress{

margin-top:18px;

font-size:14px;
font-weight:700;

color:#166534;

}

.big-button{

touch-action:
manipulation;

pointer-events:auto;

-webkit-user-select:none;
user-select:none;

-webkit-touch-callout:none;

}

.big-button,
.reset-btn{

-webkit-tap-highlight-color:
transparent;

}

.big-button{

will-change:
transform;

transform:
translateZ(0);

}

</style>

</head>

<body>

<main class="page">

<section class="hero">

<div class="hero-badge">
📿 Namaz Sonrası Tesbihat
</div>

<h1>
Zikirmatik
</h1>

<p>
Namaz sonrası yapılan tesbihatları kolayca takip edin.
33 tekrar tamamlandığında otomatik sonraki zikre geçer.
</p>

</section>

<section class="zikir-card">

<div class="zikir-label">
Şu Anki Zikir
</div>

<div
class="zikir-name"
id="zikirName"
>
Subhanallah
</div>

<div
class="zikir-desc"
id="zikirDesc"
>
Allah’ı noksan sıfatlardan tenzih etmek.
</div>

<div
class="counter"
id="counter"
>
0
</div>

<button
class="big-button"
id="tapButton"
aria-label="Zikir sayacı"
>
TIKLA
</button>

<div
class="progress"
id="progress"
>
1 / 3
</div>

<button
class="reset-btn"
onclick="resetAll()"
>
Sıfırla
</button>

</section>

</main>

<script>

const zikirler = [

{
name:"Subhanallah",
desc:"Allah’ı noksan sıfatlardan tenzih etmek."
},

{
name:"Elhamdülillah",
desc:"Allah’a hamd etmek."
},

{
name:"Allahu Ekber",
desc:"Allah’ın en büyük olduğunu zikretmek."
}

];

let currentIndex = 0;
let count = 0;

const counter =
document.getElementById(
"counter"
);

const zikirName =
document.getElementById(
"zikirName"
);

const zikirDesc =
document.getElementById(
"zikirDesc"
);

const progress =
document.getElementById(
"progress"
);

function render(){

counter.textContent =
count;

zikirName.textContent =
zikirler[currentIndex].name;

zikirDesc.textContent =
zikirler[currentIndex].desc;

progress.textContent =
`${currentIndex + 1} / 3`;

}

document
.getElementById("tapButton")
.addEventListener(
"click",
()=>{

count++;

if(count >= 33){

count = 0;

currentIndex++;

if(
currentIndex >=
zikirler.length
){

currentIndex = 0;

alert(
"Tesbihat tamamlandı 🌙"
);

}

}

render();

}
);

function resetAll(){

currentIndex = 0;
count = 0;

render();

}

render();


let lastTouchEnd = 0;

const tapButton =
document.getElementById(
"tapButton"
);

tapButton.addEventListener(
"touchend",
function(event){

const now =
Date.now();

if(
now - lastTouchEnd <= 300
){

event.preventDefault();

}

lastTouchEnd = now;

},
{passive:false}
);


</script>

<script src="footer.js"></script>

</body>
</html>
