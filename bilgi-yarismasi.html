<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
TemizMescid | Bilgi Yarışması
</title>

<meta
name="description"
content="İslami bilgi yarışması ile dini bilgi seviyenizi test edin. Siyer, ilmihal, Kur'an ve genel dini bilgiler."
>

<meta
name="keywords"
content="islami bilgi yarışması, dini test, ilmihal soruları, siyer testi, islam bilgi yarışması"
>

<meta
name="theme-color"
content="#08171b"
>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

font-family:
Inter,
system-ui,
sans-serif;

background:
radial-gradient(
circle at top,
#21454b 0%,
#10252a 35%,
#08171b 100%
);

min-height:100vh;

overflow-x:hidden;

color:#fff;

}

.page{

max-width:520px;

margin:auto;

padding:
18px 18px 140px;

}

/* HERO */

.quiz-hero{

position:relative;

overflow:hidden;

padding:
28px 24px;

border-radius:34px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.12),
rgba(255,255,255,.04)
);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.08);

margin-bottom:18px;

box-shadow:
0 18px 40px rgba(0,0,0,.18);

}

.quiz-hero::before{

content:"";

position:absolute;

top:-100px;
right:-100px;

width:240px;
height:240px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(76,175,80,.18),
transparent 70%
);

}

.quiz-badge{

display:inline-flex;

align-items:center;
justify-content:center;

width:72px;
height:72px;

border-radius:24px;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

font-size:32px;

margin-bottom:18px;

box-shadow:
0 10px 24px rgba(0,0,0,.16);

}

.quiz-hero h1{

font-size:38px;
font-weight:900;

line-height:1.08;

margin-bottom:12px;

letter-spacing:-1px;

}

.quiz-hero p{

font-size:14px;
line-height:1.8;

color:
rgba(255,255,255,.76);

max-width:320px;

}

/* SCORE */

.score-box{

display:grid;

grid-template-columns:
1fr 1fr 1fr;

gap:12px;

margin-bottom:18px;

}

.score-item{

background:
rgba(255,255,255,.08);

border-radius:22px;

padding:
18px 14px;

text-align:center;

backdrop-filter:blur(12px);

}

.score-item strong{

display:block;

font-size:28px;
font-weight:900;

margin-bottom:6px;

}

.score-item span{

font-size:12px;

color:
rgba(255,255,255,.72);

}

/* QUIZ CARD */

.card{

background:
linear-gradient(
180deg,
rgba(255,255,255,.985),
rgba(248,250,252,.97)
);

border-radius:32px;

padding:
24px;

margin-bottom:18px;

color:#111827;

box-shadow:
0 14px 36px rgba(0,0,0,.10);

}

/* TOP */

.quiz-top{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:26px;

}

.quiz-count{

font-size:14px;

font-weight:800;

color:#166534;

}

.quiz-timer{

width:70px;
height:70px;

border-radius:22px;

background:
linear-gradient(
135deg,
#1b5e20,
#2e7d32
);

display:flex;

align-items:center;
justify-content:center;

font-size:24px;
font-weight:900;

color:#fff;

box-shadow:
0 10px 24px rgba(0,0,0,.12);

}

/* CATEGORY */

.quiz-category{

display:inline-flex;

align-items:center;

padding:
8px 14px;

border-radius:999px;

background:
rgba(22,101,52,.10);

color:#166534;

font-size:12px;
font-weight:800;

margin-bottom:18px;

}

/* QUESTION */

.question{

font-size:25px;
font-weight:900;

line-height:1.5;

margin-bottom:24px;

}

/* ANSWERS */

.answers{

display:flex;

flex-direction:column;

gap:12px;

}

.answer-btn{

width:100%;

min-height:68px;

border:none;

border-radius:20px;

padding:
18px;

text-align:left;

font-size:15px;
font-weight:700;

background:#f3f4f6;

color:#111827;

transition:.2s;

cursor:pointer;

}

.answer-btn:active{
transform:scale(.98);
}

.answer-btn.correct{

background:#dcfce7;

color:#166534;

}

.answer-btn.wrong{

background:#fee2e2;

color:#991b1b;

}

/* RESULT */

.result-box{

text-align:center;

padding:
24px 10px;

}

.result-box h2{

font-size:36px;

font-weight:900;

margin-bottom:14px;

}

.result-box p{

font-size:15px;

line-height:1.9;

color:#6b7280;

margin-bottom:24px;

}

.result-badge{

display:inline-flex;

padding:
10px 16px;

border-radius:999px;

background:
rgba(22,101,52,.08);

color:#166534;

font-size:13px;
font-weight:800;

margin-bottom:18px;

}

.restart-btn{

width:100%;

height:58px;

border:none;

border-radius:20px;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

color:#fff;

font-size:15px;
font-weight:900;

box-shadow:
0 10px 24px rgba(0,0,0,.16);

}

/* MOBILE */

@media(max-width:480px){

.page{
padding:
16px 16px 140px;
}

.quiz-hero h1{
font-size:34px;
}

.question{
font-size:22px;
}

}

</style>

</head>

<body>

<main class="page">

<section class="quiz-hero">

<div class="quiz-badge">
🧠
</div>

<h1>
Bilgi
Yarışması
</h1>

<p>
Kur'an, ilmihal, siyer, ibadetler ve genel dini bilgiler ile bilginizi test edin.
</p>

</section>

<div class="score-box">

<div class="score-item">
<strong id="scoreValue">
0
</strong>
<span>Puan</span>
</div>

<div class="score-item">
<strong id="correctValue">
0
</strong>
<span>Doğru</span>
</div>

<div class="score-item">
<strong id="wrongValue">
0
</strong>
<span>Yanlış</span>
</div>

</div>

<section class="card" id="quizCard">

<div class="quiz-top">

<div class="quiz-count" id="questionCount">
1 / 30
</div>

<div class="quiz-timer" id="timer">
30
</div>

</div>

<div
class="quiz-category"
id="categoryText"
>
Genel Dini Bilgi
</div>

<div
class="question"
id="questionText"
>
Yükleniyor...
</div>

<div
class="answers"
id="answers"
>
</div>

</section>

</main>

<script>

/* =========================
QUESTION POOL
========================= */

const QUESTION_POOL = [

{

},

{

"Oruç tutmak",
"Kelime-i Şehadet",
"Zekat vermek",
"Hacca gitmek"
],
correct:1
},

{
category:"Namaz",
q:"Namaz hangi olaydan sonra farz kılınmıştır?",
a:[
"Miraç",
"Hicret",
"Bedir",
"Hudeybiye"
],
correct:0
},

{
category:"Kur'an",
q:"Kur'an hangi ayda indirilmeye başlanmıştır?",
a:[
"Muharrem",
"Şaban",
"Ramazan",
"Recep"
],
correct:2
},

{
category:"Siyer",
q:"Peygamberimizin doğduğu şehir hangisidir?",
a:[
"Medine",
"Kudüs",
"Mekke",
"Taif"
],
correct:2
},

{
category:"Siyer",
q:"İlk vahiy hangi mağarada gelmiştir?",
a:[

"Hira",
"Uhud",
"Nur"
],
correct:1
},

{
category:"İslam",
q:"İslam'da zekat vermek kaçıncı şarttır?",
a:["2","3","4","5"],
correct:1
},

{
category:"Namaz",
q:"Kıble hangi şehirde bulunmaktadır?",
a:[
"Mekke",
"Medine",
"Kudüs",
"Kahire"
],
correct:0
},

{
category:"Kur'an",
q:"Kur'an'ın ilk suresi hangisidir?",
a:[
"Bakara",
"İhlas",
"Fatiha",
"Yasin"
],
correct:2
},

{
category:"Siyer",
q:"Peygamberimizin babasının adı nedir?",
a:[
"Ebu Talib",
"Abdullah",
"Abdulmuttalib",
"Hamza"
],
correct:1
},

{
category:"İlmihal",
q:"Abdestte yüzü yıkamak farz mıdır?",
a:[
"Evet",
"Hayır",
"Sünnettir",
"Mekruhtur"
],
correct:0
},

{
category:"Kur'an",
q:"En uzun sure hangisidir?",
a:[
"Yasin",
"Nisa",
"Bakara",
"Kehf"
],
correct:2
},

{
category:"Siyer",
q:"Hicret hangi şehre yapılmıştır?",
a:[
"Taif",
"Şam",
"Medine",
"Kudüs"
],
correct:2
},

{
category:"İslam",
q:"Oruç hangi ayda tutulur?",
a:[
"Şevval",
"Ramazan",
"Muharrem",
"Recep"
],
correct:1
},

{
category:"Namaz",
q:"Günde kaç vakit farz namaz vardır?",
a:[
"3",
"4",
"5",
"6"
],
correct:2
},

{
category:"Kur'an",
q:"İhlas suresi kaç ayettir?",
a:[
"3",
"4",
"5",
"6"
],
correct:1
},

{
category:"Siyer",
q:"Peygamberimizin annesinin adı nedir?",
a:[
"Aişe",
"Hatice",
"Amine",
"Hafsa"
],
correct:2
},

{
category:"İlmihal",
q:"Teyemmüm ne ile yapılır?",
a:[
"Toprak",
"Su",
"Sabun",
"Yağmur"
],
correct:0
},

{
category:"Kur'an",
q:"Kur'an hangi dilde indirilmiştir?",
a:[
"Farsça",
"Türkçe",
"Arapça",
"İbranice"
],
correct:2
},

{
category:"Siyer",
q:"İlk Müslüman kadın kimdir?",
a:[
"Aişe",
"Hatice",
"Fatma",
"Hafsa"
],
correct:1
},

{
category:"İslam",
q:"Hac ibadeti nerede yapılır?",
a:[
"Medine",
"Mekke",
"Kudüs",
"Şam"
],
correct:1
},

{
category:"Namaz",
q:"Cuma namazı haftada kaç kez farzdır?",
a:[
"1",
"2",
"3",
"5"
],
correct:0
},

{
category:"İlmihal",
q:"Abdestte ayakları yıkamak farz mıdır?",
a:[
"Evet",
"Hayır",
"Sünnettir",
"Mekruhtur"
],
correct:0
},

{
category:"Kur'an",
q:"Kur'an'da adı geçen peygamberlerden biri hangisidir?",
a:[
"Lukman",
"Lokman",
"Yusuf",
"Harun"
],
correct:2
},

{
category:"Siyer",
q:"Peygamberimizin dedesinin adı nedir?",
a:[
"Abdulmuttalib",
"Ebu Talib",
"Abdullah",
"Hamza"
],
correct:0
},

{
category:"İslam",
q:"Zekat kimlere verilir?",
a:[
"İhtiyaç sahiplerine",
"Sadece akrabalara",
"Herkese",
"Sadece çocuklara"
],
correct:0
},

{
category:"Namaz",
q:"Sabah namazı kaç rekattır?",
a:[
"2",
"3",
"4",
"5"
],
correct:0
},

{
category:"İlmihal",
q:"Namazdan önce yapılan temizlik nedir?",
a:[
"Gusül",
"Abdest",
"İtikaf",
"Sadaka"
],
correct:1
},

{
category:"Kur'an",
q:"Kur'an kaç yılda tamamlanmıştır?",
a:[
"10",
"15",
"23",
"40"
],
correct:2
},

{
category:"Siyer",
q:"Peygamberimizin lakabı nedir?",
a:[
"El-Emin",
"Faruk",
"Zinnureyn",
"Sıddık"
],
correct:0
}

];

/* =========================
QUESTIONS
========================= */

const questions =

[...QUESTION_POOL]
.sort(()=>Math.random()-0.5)
.slice(0,30);

let current = 0;
let score = 0;
let correct = 0;
let wrong = 0;

let timer = 30;
let interval = null;

/* ELEMENTS */

const timerEl =
document.getElementById("timer");

const questionEl =
document.getElementById("questionText");

const answersEl =
document.getElementById("answers");

const countEl =
document.getElementById("questionCount");

const categoryEl =
document.getElementById("categoryText");

/* START */

renderQuestion();

/* =========================
RENDER
========================= */

function renderQuestion(){

clearInterval(interval);

timer = 30;

startTimer();

const q =
questions[current];

countEl.innerText =
`${current+1} / ${questions.length}`;

questionEl.innerText =
q.q;

categoryEl.innerText =
q.category;

answersEl.innerHTML =

q.a.map((answer,index)=>`

<button
class="answer-btn"
onclick="selectAnswer(${index})"
>
${answer}
</button>

`).join("");

}

/* =========================
TIMER
========================= */

function startTimer(){

timerEl.innerText = timer;

interval = setInterval(()=>{

timer--;

timerEl.innerText = timer;

if(timer <= 0){

clearInterval(interval);

wrong++;

updateScore();

nextQuestion();

}

},1000);

}

/* =========================
ANSWER
========================= */

function selectAnswer(index){

clearInterval(interval);

const q =
questions[current];

const buttons =
document.querySelectorAll(".answer-btn");

buttons.forEach((btn,i)=>{

btn.disabled = true;

if(i === q.correct){

btn.classList.add("correct");

}

if(
i === index &&
i !== q.correct
){

btn.classList.add("wrong");

}

});

if(index === q.correct){

score += 10;
correct++;

}else{

wrong++;

}

updateScore();

setTimeout(()=>{

nextQuestion();

},1200);

}

/* =========================
NEXT
========================= */

function nextQuestion(){

current++;

if(current >= questions.length){

finishQuiz();
return;

}

renderQuestion();

}

/* =========================
SCORE
========================= */

function updateScore(){

document.getElementById(
"scoreValue"
).innerText = score;

document.getElementById(
"correctValue"
).innerText = correct;

document.getElementById(
"wrongValue"
).innerText = wrong;

}

/* =========================
FINISH
========================= */

function finishQuiz(){

let level =
"Başlangıç";

if(score >= 250){
level = "İleri Seviye";
}
else if(score >= 180){
level = "Orta Seviye";
}

document.getElementById(
"quizCard"
).innerHTML = `

<div class="result-box">

<div class="result-badge">
${level}
</div>

<h2>
🏆 ${score} Puan
</h2>

<p>

Yarışmayı tamamladınız.
<br><br>

Doğru: ${correct}
<br>

Yanlış: ${wrong}

</p>

<button
class="restart-btn"
onclick="location.reload()"
>
Tekrar Başlat
</button>

</div>

`;

}

</script>

<script src="footer.js"></script>

</body>
</html>
