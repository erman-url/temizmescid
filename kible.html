<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
TemizMescid | Kıble Pusulası
</title>

<meta
name="description"
content="Mobil uyumlu kıble pusulası ile bulunduğunuz konuma göre kıble yönünü bulun."
>

<meta
name="theme-color"
content="#0b2422"
>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
Inter,
system-ui,
sans-serif;

background:
radial-gradient(
circle at top,
#21454b 0%,
#10252a 35%,
#08171b 100%
);

min-height:100vh;

color:#fff;

overflow-x:hidden;

}

.kible-page{

max-width:420px;

margin:auto;

padding:
20px 18px 140px;

}

/* HERO */

.kible-hero{

position:relative;

overflow:hidden;

padding:
28px 24px;

border-radius:30px;

background:
linear-gradient(
180deg,
rgba(15,44,42,.96),
rgba(11,36,34,.92)
);

border:
1px solid rgba(255,255,255,.05);

box-shadow:
0 12px 40px rgba(0,0,0,.22);

margin-bottom:22px;

}

.kible-badge{

display:inline-flex;

padding:
8px 14px;

border-radius:999px;

font-size:12px;
font-weight:700;

background:
rgba(255,255,255,.08);

margin-bottom:18px;

}

.kible-hero h1{

font-size:40px;
font-weight:800;

line-height:1;

letter-spacing:-1.8px;

margin-bottom:14px;

}

.kible-hero p{

font-size:14px;
line-height:1.8;

color:
rgba(255,255,255,.72);

max-width:300px;

}

/* CARD */

.compass-card{

position:relative;

overflow:hidden;

padding:26px;

border-radius:32px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.10),
rgba(255,255,255,.04)
);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.08);

box-shadow:
0 12px 40px rgba(0,0,0,.22);

text-align:center;

}

.compass-card::before{

content:"";

position:absolute;

top:-80px;
right:-80px;

width:180px;
height:180px;

border-radius:999px;

background:
rgba(46,125,50,.18);

filter:blur(50px);

}

.compass-wrap{

position:relative;

width:280px;
height:280px;

margin:
10px auto 24px;

}

.compass-bg{

position:absolute;

inset:0;

border-radius:999px;

border:
10px solid rgba(255,255,255,.06);

background:
radial-gradient(
circle,
rgba(255,255,255,.04),
rgba(255,255,255,.01)
);

box-shadow:
inset 0 0 30px rgba(0,0,0,.18);

}

.compass-arrow{

position:absolute;

left:50%;
top:50%;

width:10px;
height:120px;

transform:
translate(-50%,-100%);

transform-origin:
bottom center;

transition:
transform .25s linear;

z-index:3;

}

.arrow-head{

width:0;
height:0;

border-left:18px solid transparent;
border-right:18px solid transparent;

border-bottom:36px solid #22c55e;

margin:auto;

filter:
drop-shadow(0 4px 10px rgba(34,197,94,.45));

}

.arrow-line{

width:8px;
height:86px;

margin:auto;

border-radius:999px;

background:
linear-gradient(
180deg,
#22c55e,
#15803d
);

}

.compass-center{

position:absolute;

left:50%;
top:50%;

width:28px;
height:28px;

border-radius:999px;

background:#fff;

transform:
translate(-50%,-50%);

z-index:5;

box-shadow:
0 4px 14px rgba(255,255,255,.25);

}

.direction-text{

font-size:18px;
font-weight:800;

margin-bottom:8px;

}

.degree-text{

font-size:14px;

color:
rgba(255,255,255,.65);

margin-bottom:18px;

}

.location-text{

font-size:13px;
line-height:1.6;

color:
rgba(255,255,255,.55);

}

.permission-btn{

border:none;

padding:
16px 20px;

border-radius:18px;

margin-top:20px;

font-size:15px;
font-weight:700;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

color:#fff;

width:100%;

cursor:pointer;

}

.footer{
position:fixed;
}

@media(max-width:480px){

.compass-wrap{
width:240px;
height:240px;
}

.kible-hero h1{
font-size:34px;
}

}

</style>

</head>

<body>

<main class="kible-page">

<section class="kible-hero">

<div class="kible-badge">
TemizMescid Araçlar
</div>

<h1>
Kıble
Pusulası
</h1>

<p>
Bulunduğunuz konuma göre gerçek zamanlı kıble yönünü bulun.
</p>

</section>

<section class="compass-card">

<div class="compass-wrap">

<div class="compass-bg"></div>

<div
class="compass-arrow"
id="compassArrow"
>

<div class="arrow-head"></div>
<div class="arrow-line"></div>

</div>

<div class="compass-center"></div>

</div>

<div
class="direction-text"
id="directionText"
>
Kıble Yönü Hazırlanıyor
</div>

<div
class="degree-text"
id="degreeText"
>
0°
</div>

<div
class="location-text"
id="locationText"
>
Konum izni bekleniyor...
</div>

<button
class="permission-btn"
id="startCompass"
>
Pusulayı Başlat
</button>

</section>

</main>

<script>

const KAABA_LAT = 21.4225;
const KAABA_LNG = 39.8262;

const arrow =
document.getElementById(
"compassArrow"
);

const directionText =
document.getElementById(
"directionText"
);

const degreeText =
document.getElementById(
"degreeText"
);

const locationText =
document.getElementById(
"locationText"
);

const startBtn =
document.getElementById(
"startCompass"
);

let qiblaBearing = 0;

function toRad(deg){
return deg * Math.PI / 180;
}

function toDeg(rad){
return rad * 180 / Math.PI;
}

function calculateQibla(
lat,
lng
){

const phiK = toRad(KAABA_LAT);
const lambdaK = toRad(KAABA_LNG);

const phi = toRad(lat);
const lambda = toRad(lng);

const y =
Math.sin(lambdaK - lambda);

const x =
Math.cos(phi) * Math.tan(phiK)
-
Math.sin(phi) * Math.cos(lambdaK - lambda);

let bearing =
toDeg(Math.atan2(y, x));

bearing =
(bearing + 360) % 360;

return bearing;

}

function updateCompass(
heading
){

const rotation =
(qiblaBearing - heading + 360) % 360;

arrow.style.transform =
`translate(-50%,-100%) rotate(${rotation}deg)`;

}

function initCompass(){

navigator.geolocation.getCurrentPosition(
(position)=>{

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

qiblaBearing =
calculateQibla(lat,lng);

const rounded =
Math.round(qiblaBearing);

degreeText.innerHTML =
`${rounded}°`;

locationText.innerHTML =
`${lat.toFixed(4)}, ${lng.toFixed(4)}`;

if(
window.DeviceOrientationEvent &&
typeof DeviceOrientationEvent.requestPermission === 'function'
){

DeviceOrientationEvent
.requestPermission()
.then(permission=>{

if(permission === 'granted'){

window.addEventListener(
'deviceorientation',
(e)=>{

const heading =
e.webkitCompassHeading ||
(360 - e.alpha);

updateCompass(heading);

}
);

}

});

}else{

window.addEventListener(
'deviceorientation',
(e)=>{

let heading = null;

if(e.webkitCompassHeading){

heading =
e.webkitCompassHeading;

}else if(e.alpha !== null){

heading =
360 - e.alpha;

}

if(heading !== null){

updateCompass(heading);

}

},
true
);

}

directionText.innerHTML =
"Kıble Yönü Hazır";

},
()=>{

alert(
"Konum izni gerekli"
);

}
);

}

startBtn.addEventListener(
'click',
initCompass
);

</script>

</body>
</html>
