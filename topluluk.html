<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
Topluluk Paylaşımları | TemizMescid
</title>

<meta
name="description"
content="Kullanıcıların eklediği gerçek mescid değerlendirmelerini keşfedin."
>

<meta
name="keywords"
content="mescid yorumları, topluluk paylaşımları, mescid puanlama"
>

<meta
name="theme-color"
content="#0b2422"
>

<link rel="stylesheet" href="style.css?v=2">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

font-family:
Inter,
system-ui,
sans-serif;

background:
radial-gradient(
circle at top,
#21454b 0%,
#10252a 35%,
#08171b 100%
);

min-height:100vh;
overflow-x:hidden;

color:#fff;

}

.page{

max-width:430px;

margin:auto;

padding:
18px 18px 140px;

}

/* HERO */

.hero{

position:relative;

overflow:hidden;

padding:
28px 24px;

border-radius:34px;

margin-bottom:20px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.12),
rgba(255,255,255,.05)
);

border:
1px solid rgba(255,255,255,.08);

box-shadow:
0 18px 40px rgba(0,0,0,.22);

}

.hero::before{

content:"";

position:absolute;

top:-60px;
right:-60px;

width:180px;
height:180px;

border-radius:999px;

background:
rgba(255,255,255,.06);

filter:blur(40px);

}

.hero-badge{

display:inline-flex;
align-items:center;
justify-content:center;

padding:
8px 14px;

border-radius:999px;

background:
rgba(255,255,255,.08);

font-size:12px;
font-weight:700;

margin-bottom:18px;

color:
rgba(255,255,255,.78);

}

.hero h1{

font-size:38px;
font-weight:900;

line-height:1.05;

margin-bottom:14px;

letter-spacing:-1px;

}

.hero p{

font-size:14px;
line-height:1.8;

max-width:320px;

color:
rgba(255,255,255,.74);

}

/* STATS */

.stats{

display:grid;

grid-template-columns:
1fr 1fr 1fr;

gap:12px;

margin-bottom:22px;

}

.stat-card{

padding:18px;

border-radius:24px;

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.06);

text-align:center;

}

.stat-card strong{

display:block;

font-size:24px;
font-weight:900;

margin-bottom:6px;

}

.stat-card span{

font-size:11px;
line-height:1.6;

color:
rgba(255,255,255,.72);

}

/* FEED */

.feed{
display:flex;
flex-direction:column;
gap:18px;
}

/* CARD */

.feed-card{

overflow:hidden;

border-radius:32px;

background:
linear-gradient(
180deg,
rgba(255,255,255,.985),
rgba(248,250,252,.97)
);

box-shadow:
0 12px 30px rgba(0,0,0,.08);

color:#111827;

}

/* IMAGE */

.feed-image{

width:100%;
height:210px;

object-fit:cover;

display:block;

background:#e5e7eb;

}

/* CONTENT */

.feed-content{
padding:22px;
}

/* TOP */

.feed-top{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:16px;

}

.feed-type{

display:inline-flex;
align-items:center;
justify-content:center;

height:32px;
padding:0 14px;

border-radius:999px;

background:#ecfdf3;

font-size:12px;
font-weight:800;

color:#15803d;

}

.feed-time{

font-size:12px;
font-weight:700;

color:#9ca3af;

}

/* TITLE */

.feed-title{

font-size:26px;
font-weight:900;

line-height:1.2;

margin-bottom:12px;

}

/* LOCATION */

.feed-location{

display:flex;
align-items:center;
gap:8px;

font-size:13px;
font-weight:700;

color:#6b7280;

margin-bottom:18px;

}

/* SCORE */

.feed-scores{

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

margin-bottom:18px;

}

.score-box{

display:flex;
justify-content:space-between;
align-items:center;

padding:14px;

border-radius:18px;

background:#f8fafc;

border:
1px solid rgba(0,0,0,.05);

font-size:13px;
font-weight:800;

color:#374151;

}

.score-box b{

font-size:14px;
color:#1b5e20;

}

/* COMMENT */

.feed-comment{

padding:18px;

border-radius:22px;

background:#f8fafc;

border:
1px solid rgba(0,0,0,.05);

font-size:14px;
line-height:1.9;

color:#4b5563;

margin-bottom:18px;

}

/* BUTTON */

.feed-btn{

width:100%;
height:56px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#2e7d32,
#1b5e20
);

color:#fff;

font-size:15px;
font-weight:800;

}

/* EMPTY */

.empty-state{

padding:40px 24px;

border-radius:28px;

background:
rgba(255,255,255,.08);

text-align:center;

border:
1px solid rgba(255,255,255,.08);

}

.empty-state h3{

font-size:22px;
margin-bottom:12px;

}

.empty-state p{

font-size:14px;
line-height:1.8;

color:
rgba(255,255,255,.7);

}

/* MOBILE */

@media(max-width:480px){

.hero h1{
font-size:32px;
}

.feed-title{
font-size:22px;
}

.feed-image{
height:190px;
}

}

</style>

</head>

<body>

<main class="page">

<!-- HERO -->

<section class="hero">

<div class="hero-badge">
Topluluk Akışı
</div>

<h1>
Mescid
Paylaşımları
</h1>

<p>
Topluluk tarafından eklenen gerçek mescid değerlendirmelerini keşfedin.
</p>

</section>

<!-- STATS -->

<section class="stats">

<div class="stat-card">

<strong id="totalMescid">
0
</strong>

<span>
Toplam Mescid
</span>

</div>

<div class="stat-card">

<strong id="totalReviews">
0
</strong>

<span>
Değerlendirme
</span>

</div>

<div class="stat-card">

<strong id="totalComments">
0
</strong>

<span>
Topluluk Yorumu
</span>

</div>

</section>

<!-- FEED -->

<section
class="feed"
id="communityFeed"
>

<div class="empty-state">

<h3>
Yükleniyor...
</h3>

<p>
Topluluk paylaşımları getiriliyor.
</p>

</div>

</section>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
query,
orderBy,
limit,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey:"API_KEY",
authDomain:"PROJECT.firebaseapp.com",
projectId:"PROJECT_ID",
storageBucket:"PROJECT.appspot.com",
messagingSenderId:"XXXX",
appId:"XXXX"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =========================
ELEMENTS
========================= */

const feed =
document.getElementById(
"communityFeed"
);

const totalMescid =
document.getElementById(
"totalMescid"
);

const totalReviews =
document.getElementById(
"totalReviews"
);

const totalComments =
document.getElementById(
"totalComments"
);

/* =========================
SAFE HTML
========================= */

function escapeHtml(str){

if(!str){
return "";
}

return str
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* =========================
TIME FORMAT
========================= */

function timeAgo(timestamp){

if(!timestamp){
return "Yeni";
}

let value = timestamp;

if(typeof timestamp === "object"){

if(timestamp.seconds){
value = timestamp.seconds * 1000;
}

}

const now = Date.now();

const diff =
now - value;

const minutes =
Math.floor(diff / 60000);

const hours =
Math.floor(diff / 3600000);

const days =
Math.floor(diff / 86400000);

if(minutes < 1){
return "Az önce";
}

if(minutes < 60){
return `${minutes} dk önce`;
}

if(hours < 24){
return `${hours} saat önce`;
}

return `${days} gün önce`;

}

/* =========================
SAFE SCORE
========================= */

function safeScore(val){

if(
val === undefined ||
val === null ||
val === ""
){
return "-";
}

return Number(val).toFixed(0);

}

/* =========================
LOAD FEED
========================= */

async function loadFeed(){

try{

const q =
query(
collection(db,"mescids"),
orderBy("createdAt","desc"),
limit(20)
);

const snap =
await getDocs(q);

feed.innerHTML = "";

let total = 0;
let comments = 0;

snap.forEach(doc=>{

const data = doc.data();

total++;

if(
data.extraNote &&
data.extraNote.trim() !== ""
){
comments++;
}

const image =
data.images?.[0] ||
"assets/img/default.jpg";

feed.innerHTML += `

<article class="feed-card">

<img
src="${image}"
class="feed-image"
alt="Mescid"
loading="lazy"
>

<div class="feed-content">

<div class="feed-top">

<div class="feed-type">
Yeni Eklenen
</div>

<div class="feed-time">
${timeAgo(data.createdAt)}
</div>

</div>

<div class="feed-title">
${escapeHtml(
data.mescidName ||
"İsimsiz Mescid"
)}
</div>

<div class="feed-location">
📍
${escapeHtml(
data.district || "-"
)}
/
${escapeHtml(
data.city || "-"
)}
</div>

<div class="feed-scores">

<div class="score-box">
<span>
🧼 Temizlik
</span>

<b>
${safeScore(
data.cleanliness
)}
</b>

</div>

<div class="score-box">

<span>
🤫 Sessizlik
</span>

<b>
${safeScore(
data.sound
)}
</b>

</div>

<div class="score-box">

<span>
💨 Havalandırma
</span>

<b>
${safeScore(
data.air
)}
</b>

</div>

<div class="score-box">

<span>
🚿 Abdesthane
</span>

<b>
${data.ablution === "yes"
? "Var"
: "Yok"}
</b>

</div>

</div>

<div class="feed-comment">

${escapeHtml(
data.extraNote ||
"Topluluk değerlendirmesi eklendi."
)}

</div>

<button
class="feed-btn"
onclick="
location.href=
'mescid-detay.html?id=${doc.id}'
"
>
Mescidi İncele
</button>

</div>

</article>

`;

});

totalMescid.textContent =
total;

totalReviews.textContent =
total;

totalComments.textContent =
comments;

if(total === 0){

feed.innerHTML = `

<div class="empty-state">

<h3>
Henüz paylaşım yok
</h3>

<p>
Topluluk tarafından eklenen ilk mescidi sen paylaş.
</p>

</div>

`;

}

}catch(err){

console.error(err);

feed.innerHTML = `

<div class="empty-state">

<h3>
Veriler yüklenemedi
</h3>

<p>
Lütfen daha sonra tekrar deneyin.
</p>

</div>

`;

}

}

loadFeed();

</script>

<script src="footer.js?v=2"></script>

</body>
</html>
